name: Metrics

on:
  # Refresh the cards once a day (06:00 UTC = 03:00 in Brazil)
  schedule: [{cron: "0 6 * * *"}]
  # Run manually from the Actions tab, and on each push to main
  workflow_dispatch:
  push: {branches: ["main"]}

# The cards are committed back to this repository by GITHUB_TOKEN
permissions:
  contents: write

# Never let two runs commit at the same time
concurrency:
  group: metrics
  cancel-in-progress: false

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:

      - name: Header
        uses: lowlighter/metrics@latest
        with:
          filename: header.svg
          # Personal access token stored in the repository secrets
          token: ${{ secrets.METRICS_SECRET }}
          # GITHUB_TOKEN is auto-generated and only used to commit the card
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          user: phximenes
          template: classic
          base: header
          config_timezone: America/Sao_Paulo

      - name: Repositories
        uses: lowlighter/metrics@latest
        with:
          filename: repositories.svg
          token: ${{ secrets.METRICS_SECRET }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          user: phximenes
          template: classic
          base: repositories
          config_timezone: America/Sao_Paulo

      - name: Activity and community
        uses: lowlighter/metrics@latest
        with:
          filename: acti_comm.svg
          token: ${{ secrets.METRICS_SECRET }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          user: phximenes
          template: classic
          base: activity, community
          config_timezone: America/Sao_Paulo

      - name: Isometric calendar
        uses: lowlighter/metrics@latest
        with:
          filename: iso_calender.svg
          token: ${{ secrets.METRICS_SECRET }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          user: phximenes
          template: classic
          base: ""
          config_timezone: America/Sao_Paulo
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

      - name: Issues, pull requests and languages
        uses: lowlighter/metrics@latest
        with:
          filename: issue_pr_lang.svg
          token: ${{ secrets.METRICS_SECRET }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          user: phximenes
          template: classic
          base: ""
          config_timezone: America/Sao_Paulo
          plugin_followup: yes
          plugin_languages: yes

      - name: Habits
        uses: lowlighter/metrics@latest
        with:
          filename: github-habits.svg
          token: ${{ secrets.METRICS_SECRET }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          user: phximenes
          template: classic
          base: ""
          config_timezone: America/Sao_Paulo
          plugin_habits: yes
          plugin_habits_from: 200       # Use 200 events to compute habits
          plugin_habits_days: 14        # Keep only events from last 14 days
          plugin_habits_charts: yes     # Display charts section
          plugin_habits_trim: yes       # Trim unused hours on daily chart

      - name: Achievements
        uses: lowlighter/metrics@latest
        with:
          filename: achievements.svg
          token: ${{ secrets.METRICS_SECRET }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          user: phximenes
          template: classic
          base: ""
          config_timezone: America/Sao_Paulo
          plugin_achievements: yes
          plugin_achievements_threshold: C      # Display achievements with rank C or higher
          plugin_achievements_secrets: yes      # Display unlocked secrets achievements
          plugin_achievements_display: compact  # Use compact display
          plugin_achievements_limit: 0          # Display all unlocked achievements (no limit)
