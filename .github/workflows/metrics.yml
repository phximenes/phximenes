name: Metrics

on:
  # Refresh the cards once a day (06:00 UTC = 03:00 in Brazil)
  schedule: [{cron: "0 6 * * *"}]
  # Run manually from the Actions tab, and on each push to main
  workflow_dispatch:
  push: {branches: ["main"]}

# The cards are committed back to this repository by GITHUB_TOKEN
permissions:
  contents: write

# Never let two runs commit at the same time
concurrency:
  group: metrics
  cancel-in-progress: false

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:

      # Left card: activity, community, repositories and most used languages
      - name: Overview
        uses: lowlighter/metrics@latest
        with:
          filename: overview.svg
          # Personal access token stored in the repository secrets
          token: ${{ secrets.METRICS_SECRET }}
          # GITHUB_TOKEN is auto-generated and only used to commit the card
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          committer_branch: ${{ github.ref_name }}
          user: phximenes
          template: classic
          base: activity, community, repositories
          config_timezone: America/Sao_Paulo
          plugin_languages: yes
          plugin_languages_limit: 6

      # Right card: isometric contribution calendar
      - name: Calendar
        uses: lowlighter/metrics@latest
        with:
          filename: calendar.svg
          token: ${{ secrets.METRICS_SECRET }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          committer_branch: ${{ github.ref_name }}
          user: phximenes
          template: classic
          base: ""
          config_timezone: America/Sao_Paulo
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      # The habits and achievements plugins are left out on purpose: both
      # crash against the current GitHub API (see the run of 2026-11-21).
